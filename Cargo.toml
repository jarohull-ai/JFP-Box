[package]
name = "jfp-box"
version = "0.4.0"
edition = "2021"
description = "Policy-first planner for JFP Box manifests"
license-file = "LICENSE"
repository = "https://github.com/jarohull-ai/JFP-Box"
documentation = "https://docs.rs/jfp-box"
keywords = ["ai-agents", "ai-security", "policy-as-code", "multi-agent", "rust"]

[[bin]]
name = "jfp-box"
path = "src/main.rs"

[dev-dependencies]
criterion = "0.5.1"
proptest = "1.6.0"

[[bench]]
name = "policy"
harness = false
