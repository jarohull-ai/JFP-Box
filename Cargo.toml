[package]
name = "jfp-box"
version = "0.5.1"
edition = "2021"
description = "Universal policy gate and zero-trust security guardrail for AI agent tasks"
license-file = "LICENSE"
repository = "https://github.com/jarohull-ai/JFP-Box"
documentation = "https://docs.rs/jfp-box"
keywords = ["ai-agents", "ai-security", "policy-as-code", "multi-agent", "rust"]

[[bin]]
name = "jfp-box"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

[dev-dependencies]
criterion = "0.5.1"
proptest = "1.6.0"

[[bench]]
name = "policy"
harness = false
